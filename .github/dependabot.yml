version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before an update is proposed.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # The types follow the oldest Node.js the packages support.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major is its own change, made by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /packages/n8n-nodes-hyperodds
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      n8n:
        patterns: ["n8n-workflow", "@n8n/*", "eslint", "typescript"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The n8n node CLI and its ESLint rules expect TypeScript 5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
