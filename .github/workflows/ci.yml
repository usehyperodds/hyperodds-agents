name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/n8n-nodes-hyperodds/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: packages/n8n-nodes-hyperodds
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --workspaces
      - run: npm pack --dry-run
        working-directory: packages/n8n-nodes-hyperodds
